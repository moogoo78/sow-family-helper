<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>荒野親子團通訊錄</title>
<link rel="manifest" href="/static/manifest.json" />
<link rel="icon" href="/static/icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/static/icon.svg" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>

<div id="login-screen" class="screen hidden">
  <form id="login-form" class="login-card">
    <h1>荒野親子團通訊錄</h1>
    <p class="group-label"></p>
    <p class="hint">請輸入通行密碼</p>
    <input id="login-password" type="password" placeholder="密碼" autocomplete="current-password" autofocus />
    <button type="submit">登入</button>
    <p id="login-error" class="error hidden"></p>
  </form>
</div>

<div id="app-screen" class="screen hidden">
  <header class="topbar">
    <div id="search-bar">
      <input id="search-input" type="search" placeholder="搜尋自然名 / 姓名 / 家庭名" autocomplete="off" />
    </div>
  </header>

  <main id="results" class="results"></main>

  <footer class="app-footer">
    <button id="logout-btn" type="button">登出</button>
  </footer>

  <div id="detail" class="detail hidden">
    <button id="detail-back" class="back-btn">&larr; 返回搜尋</button>
    <div id="detail-content"></div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
